# The harness's own building blocks. Products get their own map from the
# template; this one is about this repo.

version: 1

scan:
  - src
  - bin
  - templates
  - scaffold

# Docs, the map itself and the repo's own agent config (.claude/, a copy of
# what products receive) belong to no primitive; changing them alone is low risk.
unowned:
  - docs/
  - .claude/
  - README.md
  - AGENTS.md
  - CLAUDE.md
  - SECURITY.md
  - .reins/

unowned_suffixes:
  - .test.ts

groups:
  - id: cli
    name: Command line
  - id: engine
    name: Checks and hooks
  - id: content
    name: What products receive

primitives:
  - id: cli
    group: cli
    name: CLI entry and commands
    summary: Argument parsing and the new, adopt, sync, doctor commands.
    floor: medium
    code:
      - bin
      - src/cli
    docs:
      - docs/contributing/developing.md

  - id: checks
    group: engine
    name: Checkers
    summary: decisions, links, skills, primitives map, repo rules, node version.
    floor: medium
    code:
      - src/checks
    docs:
      - docs/contributing/developing.md

  - id: hooks
    group: engine
    name: Guard and git hooks
    summary: The Claude Code Bash guard and the pre-commit/pre-push runner.
    floor: high
    code:
      - src/hooks
    docs:
      - docs/contributing/developing.md

  - id: policy
    group: engine
    name: Merge policy
    summary:
      Risk tiers, reviewer gates and per-repo authority behind `reins policy`.
    floor: high
    code:
      - src/policy
    docs:
      - docs/contributing/decisions/0005-authority-per-repo.md

  - id: templating
    group: engine
    name: Templates engine
    summary: reins.json, manifest, render, apply and three-way sync.
    floor: high
    code:
      - src/lib
    docs:
      - docs/contributing/decisions/0004-harness-is-a-cli-package.md

  - id: templates
    group: content
    name: Product templates and scaffold
    summary: Managed and owned files written into products, and the starter app.
    floor: medium
    code:
      - templates
      - scaffold
    docs:
      - docs/contributing/developing.md
